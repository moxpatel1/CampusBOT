services:
  - type: web
    name: campusbot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: campusbot-db
          property: connectionString

databases:
  - name: campusbot-db
    databaseName: campusbot_db
    user: campusbot_user
