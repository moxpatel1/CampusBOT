{% extends "base.html" %}
{% set show_navbar = false %}
{% block title %}Sign In — CampusBot{% endblock %}

{% block content %}
<div class="auth-page">
  <div class="auth-container">

    <div class="auth-back">
      <a href="/"><i class="fa-solid fa-arrow-left"></i> Back to home</a>
    </div>

    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-logo">
          <i class="fa-solid fa-graduation-cap"></i>
        </div>
        <h2>Welcome back</h2>
        <p>Sign in to your CampusBot account</p>
      </div>

      <div id="alert-container"></div>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label">Email address</label>
          <input type="email" class="form-input" id="email" placeholder="you@campus.edu" required autocomplete="email" />
        </div>
        <div class="form-group">
          <label class="form-label" style="display:flex;justify-content:space-between">
            Password
            <a href="#" style="font-size:.82rem;font-weight:400">Forgot password?</a>
          </label>
          <div class="input-icon-wrap">
            <input type="password" class="form-input" id="password" placeholder="Enter your password" required autocomplete="current-password" />
            <button type="button" id="toggle-pw" class="input-icon-btn">
              <i class="fa-solid fa-eye"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary w-full" style="justify-content:center">
          <i class="fa-solid fa-right-to-bracket"></i>
          <span class="btn-text">Sign In</span>
        </button>
      </form>

      <p class="auth-footer-text">
        Don't have an account? <a href="/register">Create one</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
document.getElementById('toggle-pw').addEventListener('click', function() {
  const pw = document.getElementById('password');
  const icon = this.querySelector('i');
  if (pw.type === 'password') {
    pw.type = 'text';
    icon.className = 'fa-solid fa-eye-slash';
  } else {
    pw.type = 'password';
    icon.className = 'fa-solid fa-eye';
  }
});

document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = e.target.querySelector('button[type=submit]');
  btn.classList.add('loading');
  const alertBox = document.getElementById('alert-container');
  alertBox.innerHTML = '';

  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        email: document.getElementById('email').value,
        password: document.getElementById('password').value
      })
    });
    const data = await res.json();
    if (data.success) {
      alertBox.innerHTML = '<div class="alert alert-success"><i class="fa-solid fa-circle-check"></i> Login successful. Redirecting...</div>';
      setTimeout(() => window.location.href = data.redirect, 700);
    } else {
      alertBox.innerHTML = `<div class="alert alert-error"><i class="fa-solid fa-circle-exclamation"></i> ${data.error}</div>`;
      btn.classList.remove('loading');
    }
  } catch {
    alertBox.innerHTML = '<div class="alert alert-error"><i class="fa-solid fa-circle-exclamation"></i> Connection error. Try again.</div>';
    btn.classList.remove('loading');
  }
});
</script>
{% endblock %}
